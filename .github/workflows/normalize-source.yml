name: Normalize canonical source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'Normalize source structure trigger')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build canonical source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wcq-canonical
          mkdir -p /tmp/wcq-canonical
          unzip -oq weekly-cell-quiz-v1.1.4-source.zip -d /tmp/wcq-canonical
          cp -R deploy-patches /tmp/wcq-canonical/deploy-patches
          cd /tmp/wcq-canonical
          node deploy-patches/apply-v115.mjs
          node deploy-patches/apply-v116.mjs
          node deploy-patches/apply-v120.mjs
          rm -rf deploy-patches .next node_modules
          rm -f tsconfig.tsbuildinfo
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/wcq-canonical/. .
      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Normalize canonical v1.2.0 source tree"
          git push
